[package]
name = "wasp"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
authors = ["WASP Contributors"]
description = "Web Attack Surface Profiler - a modular security reconnaissance scanner"
license = "MIT"
repository = "https://github.com/spectra142/wasp"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "1"
x509-parser = "0.18"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1.11"
hickory-resolver = { version = "0.26", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
askama = "0.16"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
url = "2.5"
async-trait = "0.1"
quick-xml = { version = "0.42", features = ["serialize"] }
csv = "1.3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
