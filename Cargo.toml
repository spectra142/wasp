[package]
name = "wasp"
version = "0.1.0"
edition = "2024"
authors = ["WASP Contributors"]
description = "Web Attack Surface Profiler - a modular security reconnaissance scanner"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
x509-parser = "0.17"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1.10"
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
askama = "0.13"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
url = "2"
ipnet = "2"
async-trait = "0.1"
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
